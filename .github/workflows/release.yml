name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v2.6.0, leave empty to use current ref)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install Pillow

      - name: Build Windows Standalone Package (jlink + jpackage)
        run: pwsh -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Upload Windows Standalone ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-zip
          path: distribution/COGame-Windows-x64.zip
          if-no-files-found: error

  build-and-release:
    name: Build Multi-platform & Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Tests
        run: mvn test

      - name: Package Multi-module Project
        run: mvn clean package -DskipTests

      - name: Assemble Release Assets
        run: |
          mkdir -p release-assets
          
          # 1. Windows Lightweight Launcher (Launch4j)
          cp cogame-client/target/COGame-Client.exe release-assets/COGame-Client.exe
          
          # 2. Client Fat JAR
          CLIENT_JAR=$(find cogame-client/target -maxdepth 1 -name "cogame-client-*.jar" ! -name "original-*" | head -n 1)
          cp "${CLIENT_JAR}" release-assets/COGame-Client.jar
          
          # 3. Server Fat JAR
          SERVER_JAR=$(find cogame-server/target -maxdepth 1 -name "cogame-server-*.jar" ! -name "original-*" | head -n 1)
          cp "${SERVER_JAR}" release-assets/COGame-Server.jar
          
          # 4. macOS Native .app Bundle (.zip)
          ./packaging/macos/build-macos-zip.sh release-assets/COGame-Client.jar
          cp distribution/COGame-macOS.zip release-assets/COGame-macOS.zip

      - name: Download Windows Standalone ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-standalone-zip
          path: release-assets/

      - name: List Release Assets
        run: |
          echo "=== Built Assets ==="
          ls -lh release-assets/

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: |
            release-assets/COGame-Windows-x64.zip
            release-assets/COGame-Client.exe
            release-assets/COGame-Client.jar
            release-assets/COGame-Server.jar
            release-assets/COGame-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
